<ion-content [fullscreen]="false" class="onboarding-content">
  <div class="h-screen bg-gray-50 relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 z-50">
      <div class="h-1 bg-gray-200">
        <div class="h-full bg-gradient-to-r from-blue-600 to-purple-600 transition-all duration-500 ease-out"
          [style.width.%]="((currentStep + 1) / 3) * 100"></div>
      </div>
    </div>

    <div class="absolute top-20 left-6 z-50">
      <!-- ocultar si es el primer slide  -->
      @if(currentStep > 0) {
      <button (click)="prevStep()"
        class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-all duration-200 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      }
    </div>

    <div class="absolute top-20 right-6 z-50">
      <button (click)="nextStep()"
        class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-sm hover:bg-white/30 transition-all duration-200 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <div class="relative h-full" (touchstart)="handleTouchStart($event)" (touchmove)="handleTouchMove($event)"
      (touchend)="handleTouchEnd()">
      <div class="flex h-full transition-transform duration-500 ease-out"
        [style.transform]="'translateX(-' + (currentStep * 100) + '%)'">
        <ng-container *ngFor="let stepData of onboardingData.steps; let i = index; trackBy: trackByIndex">
          <div class="w-full h-full flex-shrink-0 relative">
            <div class="absolute inset-0" [ngClass]="getBackgroundClass(i)">
              <div class="absolute inset-0 bg-black/10"></div>
            </div>

            <ng-container *ngIf="i === 0">
              <div class="absolute top-20 left-10 w-4 h-4 bg-yellow-400 rounded-full animate-pulse"></div>
              <div class="absolute top-32 right-16 w-3 h-3 bg-pink-400 rounded-full animate-bounce"></div>
              <div class="absolute bottom-40 left-20 w-5 h-5 bg-green-400 rounded-full animate-ping"></div>
              <svg class="absolute top-40 right-8 w-6 h-6 text-yellow-300 animate-spin-slow" fill="currentColor"
                viewBox="0 0 24 24">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
              </svg>
              <svg class="absolute bottom-60 right-12 w-5 h-5 text-red-400 animate-pulse" fill="currentColor"
                viewBox="0 0 24 24">
                <path
                  d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
              </svg>
            </ng-container>

            <div class="relative z-10 h-full flex flex-col">
              <div class="flex items-center justify-center p-6 pt-12">
                <div class="flex space-x-2">
                  <div *ngFor="let step of [0, 1, 2]; trackBy: trackByIndex"
                    [class]="'w-2 h-2 rounded-full transition-all duration-300 ' + (step === currentStep ? 'bg-white w-8' : 'bg-white/40')">
                  </div>
                </div>
              </div>

              <div class="flex-1 flex flex-col items-center px-8 justify-center" [class.pb-32]="i > 0">
                <ng-container *ngIf="i === 0">
                  <h1 class="text-4xl md:text-5xl font-bold text-white text-center mb-4 leading-tight">
                    {{ profile?.full_name }}
                  </h1>
                </ng-container>

                <div
                  class="w-32 h-32 bg-white/20 backdrop-blur-xl rounded-3xl flex items-center justify-center mb-8 shadow-2xl">
                  <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5.121 17.804A9.004 9.004 0 0112 15c2.21 0 4.21.805 5.879 2.146M15 11a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>

                <h1 class="text-4xl md:text-5xl font-bold text-white text-center mb-4 leading-tight">
                  {{ stepData.title }}
                </h1>

                <h2 class="text-xl md:text-2xl font-medium text-white/90 text-center mb-6">
                  {{ stepData.subtitle }}
                </h2>

                <ng-container *ngIf="stepData.description">
                  <p class="text-white/80 text-center text-lg leading-relaxed max-w-sm mb-8">
                    {{ stepData.description }}
                  </p>
                </ng-container>

                <ng-container *ngIf="stepData.benefits">
                  <div class="space-y-4 w-full max-w-sm overflow-y-auto">
                    <div *ngFor="let benefit of stepData.benefits; let j = index; trackBy: trackByIndex"
                      class="flex items-center space-x-4 bg-white/10 backdrop-blur-sm rounded-2xl p-4 transform hover:scale-105 transition-all duration-200 animate-fade-in-up"
                      [style.animation-delay]="(j * 200) + 'ms'">
                      <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path [attr.d]="benefit.iconPath" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2" />
                        </svg>
                      </div>
                      <span class="text-white font-medium text-lg flex-1">
                        {{ benefit.text }}
                      </span>
                    </div>
                  </div>
                </ng-container>
              </div>
            </div>

            <div class="absolute inset-0 pointer-events-none">
              <div *ngFor="let particle of particles; trackBy: trackByIndex"
                class="absolute w-2 h-2 bg-white/30 rounded-full animate-float" [style.left.%]="particle.left"
                [style.top.%]="particle.top" [style.animation-delay]="particle.delay + 's'"></div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

  
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar [style.--background]="getColorByStep(currentStep)">
      <div class=" bg-gradient-to-t from-black/20 to-transparent">
      <button *ngIf="currentStep === 2; else continueButton" (click)="onComplete()"
        class="w-full bg-white text-gray-900 py-4 px-6 rounded-2xl font-bold text-lg shadow-xl hover:shadow-2xl transform hover:scale-105 transition-all duration-300 flex items-center justify-center space-x-3">
        <span>{{ onboardingData.buttons.start }}</span>
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
      </button>

      <ng-template #continueButton>
        <button (click)="nextStep()"
          class="w-full bg-white/20 backdrop-blur-sm text-white py-4 px-6 rounded-2xl font-semibold text-lg border-2 border-white/30 hover:bg-white/30 transform hover:scale-105 transition-all duration-300 flex items-center justify-center space-x-3">
          <span>{{ onboardingData.buttons.continue }}</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </ng-template>
    </div>
  </ion-toolbar>
</ion-footer>
