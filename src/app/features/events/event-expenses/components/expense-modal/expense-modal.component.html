<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-scale-in">
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-100">
      <h3 class="text-xl font-bold text-gray-800">
        {{ editingExpense ? 'Editar Gasto' : 'Nuevo Gasto' }}
      </h3>
      <button
        (click)="closeModal()"
        class="p-2 rounded-full hover:bg-gray-100 transition-colors"
      >
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Modal Content -->
    <form (ngSubmit)="handleSubmit()" #expenseForm="ngForm" class="p-6 space-y-6">
      <!-- Expense Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Nombre del gasto
        </label>
        <input
          type="text"
          [(ngModel)]="formData.name"
          name="name"
          #nameField="ngModel"
          required
          minlength="3"
          placeholder="Ej: Alquiler de mesa"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all duration-200"
        />
        <div *ngIf="nameField.invalid && nameField.touched" class="text-red-500 text-sm mt-2">
          <span *ngIf="nameField.errors?.['required']">El nombre del gasto es requerido</span>
          <span *ngIf="nameField.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
        </div>
      </div>

      <!-- Cost -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Costo
        </label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <input
            type="number"
            [(ngModel)]="formData.cost"
            name="cost"
            #costField="ngModel"
            required
            min="1"
            placeholder="0"
            class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all duration-200"
          />
        </div>
        <div *ngIf="costField.invalid && costField.touched" class="text-red-500 text-sm mt-2">
          <span *ngIf="costField.errors?.['required']">El costo es requerido</span>
          <span *ngIf="costField.errors?.['min']">El costo debe ser mayor a 0</span>
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Descripción
        </label>
        <textarea
          [(ngModel)]="formData.description"
          name="description"
          #descriptionField="ngModel"
          required
          minlength="10"
          placeholder="Describe los detalles del gasto..."
          rows="3"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all duration-200 resize-none"
        ></textarea>
        <div *ngIf="descriptionField.invalid && descriptionField.touched" class="text-red-500 text-sm mt-2">
          <span *ngIf="descriptionField.errors?.['required']">La descripción es requerida</span>
          <span *ngIf="descriptionField.errors?.['minlength']">La descripción debe tener al menos 10 caracteres</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="!expenseForm.form.valid || isLoading"
        class="w-full bg-gradient-to-r from-green-600 to-emerald-600 text-white py-4 px-6 rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center space-x-3"
      >
        <div *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>{{ isLoading ? (editingExpense ? 'Actualizando...' : 'Guardando...') : (editingExpense ? 'Actualizar Gasto' : 'Guardar Gasto') }}</span>
      </button>
    </form>
  </div>
</div>
