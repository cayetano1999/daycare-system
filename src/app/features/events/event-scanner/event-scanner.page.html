<ion-header class="ion-no-border">
  <ion-toolbar class="ion-no-border ">
      <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-center">
      <h1 class="text-xl font-semibold text-gray-900">Scanner de evento</h1>
    </div>
  </div>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

<div class="min-h-screen bg-white">
  <!-- Header -->


  <!-- Content -->
  <div class="flex flex-col items-center justify-center px-6 py-20">
    <!-- Scanner Icon -->
    <div class="bg-gray-50 rounded-3xl p-8 mb-8">
      <ion-icon style="font-size: 8rem;" name="scan-circle-sharp"></ion-icon>
    </div>

    <!-- Scan Button -->
    <button 
      (click)="startScan()"
      [disabled]="isScanning"
      class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-12 py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-200 flex items-center justify-center space-x-3 mb-6">
      <svg *ngIf="!isScanning" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 16h4m-4 0v4m-6-4h2m0 0v-3m0 0h4m-4 0h2m6-7h2m-2-4h-4m4 0V4m-6 7h4m-6 0v4m0-4h2m2-7h4m0 0v3m0 0h2M9 7h1m0 0v1m0 0H9m1 0h1m0 0H9"></path>
      </svg>
      <div *ngIf="isScanning" class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
      <span>{{ isScanning ? 'Escaneando...' : 'Escanear' }}</span>
    </button>

    <button 
      (click)="goBack()"
      class="bg-red-600 hover:bg-red-700 disabled:bg-gray-400 text-white px-12 py-4 rounded-2xl font-semibold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-200 flex items-center justify-center space-x-3 mb-6">
      
      <span>Cancelar</span>
    </button>

    <!-- Event Name -->
    <div class="text-center">
      <p class="text-gray-600 text-lg font-medium">{{ event?.name }}</p>
    </div>

    <!-- Scan Result (if any) -->
    <div *ngIf="scanResult" class="mt-8 bg-green-50 border border-green-200 rounded-2xl p-6 max-w-md w-full">
      <div class="flex items-center space-x-3 mb-3">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h3 class="text-lg font-semibold text-green-800">Código escaneado</h3>
      </div>
      <p class="text-green-700 font-mono text-sm break-all">{{ scanResult }}</p>
    </div>

    <!-- Error Message (if any) -->
    <div *ngIf="errorMessage" class="mt-8 bg-red-50 border border-red-200 rounded-2xl p-6 max-w-md w-full">
      <div class="flex items-center space-x-3 mb-3">
        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h3 class="text-lg font-semibold text-red-800">Error</h3>
      </div>
      <p class="text-red-700 text-sm">{{ errorMessage }}</p>
    </div>
  </div>
</div>
</ion-content>
