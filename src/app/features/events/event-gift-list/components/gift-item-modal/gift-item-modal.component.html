<div *ngIf="isOpen" class="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-6">
  <div class="bg-white rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-scale-in">
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-100">
      <h3 class="text-xl font-bold text-gray-800">
        {{ editingItem ? 'Editar Artículo' : 'Nuevo Artículo' }}
      </h3>
      <button
        (click)="closeModal()"
        class="p-2 rounded-full hover:bg-gray-100 transition-colors"
      >
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Modal Content -->
    <form (ngSubmit)="handleSubmit()" #itemForm="ngForm" class="p-6 space-y-6">
      <!-- Article Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Nombre del artículo *
        </label>
        <input
          type="text"
          [(ngModel)]="formData.article_name"
          name="article_name"
          #nameField="ngModel"
          required
          minlength="3"
          placeholder="Ej: Televisor Smart 55 pulgadas"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all duration-200"
        />
        <div *ngIf="nameField.invalid && nameField.touched" class="text-red-500 text-sm mt-2">
          <span *ngIf="nameField.errors?.['required']">El nombre del artículo es requerido</span>
          <span *ngIf="nameField.errors?.['minlength']">El nombre debe tener al menos 3 caracteres</span>
        </div>
      </div>

      <!-- Article Code -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Código del artículo <span class="text-gray-400 text-xs">(opcional)</span>
        </label>
        <input
          type="text"
          [(ngModel)]="formData.article_code"
          name="article_code"
          placeholder="Ej: TV001, REF123"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:bg-white transition-all duration-200"
        />
      </div>

      <!-- Bought Status -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-3">
          Estado del artículo
        </label>
        <div class="grid grid-cols-2 gap-4">
          <button
            type="button"
            (click)="formData.bought = false"
            [class]="'p-4 rounded-2xl border-2 transition-all duration-300 ' + 
              (!formData.bought 
                ? 'border-orange-600 bg-orange-50 shadow-lg shadow-orange-100' 
                : 'border-gray-200 bg-white hover:border-gray-300'
              )"
          >
            <div class="text-center">
              <svg [class]="'w-8 h-8 mx-auto mb-2 ' + 
                (!formData.bought ? 'text-orange-600' : 'text-gray-400')" 
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
              </svg>
              <span [class]="'font-medium ' + 
                (!formData.bought ? 'text-orange-700' : 'text-gray-700')">
                Pendiente
              </span>
            </div>
          </button>

          <button
            type="button"
            (click)="formData.bought = true"
            [class]="'p-4 rounded-2xl border-2 transition-all duration-300 ' + 
              (formData.bought 
                ? 'border-green-600 bg-green-50 shadow-lg shadow-green-100' 
                : 'border-gray-200 bg-white hover:border-gray-300'
              )"
          >
            <div class="text-center">
              <svg [class]="'w-8 h-8 mx-auto mb-2 ' + 
                (formData.bought ? 'text-green-600' : 'text-gray-400')" 
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              <span [class]="'font-medium ' + 
                (formData.bought ? 'text-green-700' : 'text-gray-700')">
                Comprado
              </span>
            </div>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="!itemForm.form.valid || isLoading"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 px-6 rounded-2xl font-bold text-lg shadow-lg hover:shadow-xl transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center space-x-3"
      >
        <div *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span>{{ isLoading ? (editingItem ? 'Actualizando...' : 'Guardando...') : (editingItem ? 'Actualizar Artículo' : 'Guardar Artículo') }}</span>
      </button>
    </form>
  </div>
</div>
