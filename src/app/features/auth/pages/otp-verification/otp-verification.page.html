<ion-header class="ion-no-border">
  <ion-toolbar class="ion-no-border ion-no-padding">
    <!-- Header -->
    <div class="bg-white border-b border-gray-100 shadow-sm">
      <div class="flex items-center px-4 py-4">
        <button (click)="goBack()" class="p-2 -ml-2 rounded-full hover:bg-gray-100 transition-all duration-200 group">
          <svg class="w-6 h-6 text-gray-600 group-hover:text-gray-800 transition-colors" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <div class="ml-3">
          <h1 class="text-xl font-bold text-gray-800">Verificar cuenta</h1>
          <p class="text-sm text-gray-500">Confirma tu correo electrónico</p>
        </div>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="otp-content">
  <div class="min-h-screen bg-white">


    <!-- Main Content -->
    <div class="px-6 py-12">
      <div class="max-w-md mx-auto text-center">
        <!-- Icon -->
        <div class="w-24 h-24 bg-blue-50 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg">
          <svg class="w-12 h-12 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>

        <!-- Title and Description -->
        <h2 class="text-3xl font-bold text-gray-800 mb-4">
          Verifica tu correo
        </h2>
        <p class="text-gray-600 leading-relaxed mb-2">
          Hemos enviado un código de verificación de 6 dígitos a:
        </p>
        <p class="text-blue-600 font-semibold text-lg mb-8">
          {{ email }}
        </p>

        <!-- OTP Input Fields -->
        <div class="mb-8">
          <div class="flex justify-center space-x-3 mb-4">
            <input *ngFor="let digit of otp; let i = index; trackBy: trackByIndex" #otpInput type="text"
              inputmode="numeric" maxlength="1" [value]="digit" (input)="handleInputChange(i, $event)"
              (keydown)="handleKeyDown(i, $event)" (paste)="i === 0 ? handlePaste($event) : null" [class]="'w-14 h-14 text-center text-2xl font-bold border-2 rounded-xl transition-all duration-300 focus:outline-none ' + 
                (digit 
                  ? 'border-blue-600 bg-blue-50 text-blue-700 shadow-lg shadow-blue-100' 
                  : 'border-gray-200 bg-gray-50 text-gray-800 hover:border-gray-300 focus:border-blue-600 focus:bg-white focus:shadow-lg focus:shadow-blue-100'
                ) + 
                (error ? ' border-red-300 bg-red-50' : '')" [disabled]="isLoading" />
          </div>

          <!-- Error Message -->
          <div *ngIf="error" class="text-red-500 text-sm mb-4 p-3 bg-red-50 rounded-lg border border-red-200">
            {{ error }}
          </div>

          <!-- Success Indicator -->
          <div *ngIf="isOtpComplete() && !error && !isLoading"
            class="flex items-center justify-center text-green-600 text-sm mb-4">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Código completo</span>
          </div>
        </div>

        <!-- Resend Code -->
        <div class="mb-8">
          <p class="text-gray-500 text-sm mb-3">
            ¿No recibiste el código?
          </p>
          <button (click)="handleResendCode()" [disabled]="resendCooldown > 0 || isResending" style="text-align: center;
    display: contents;"
            class="text-blue-600 font-semibold hover:text-blue-700 transition-colors disabled:text-gray-400 disabled:cursor-not-allowed flex items-center justify-center space-x-2">
            <div *ngIf="isResending"
              class="w-4 h-4 border-2 border-blue-600/30 border-t-blue-600 rounded-full animate-spin"></div>
            <span class="center-content">
              {{ resendCooldown > 0
              ? 'Reenviar en ' + resendCooldown + 's'
              : (isResending ? 'Reenviando...' : 'Reenviar código')
              }}
            </span>
          </button>
        </div>

        <!-- Verify Button -->
        <button (click)="handleVerification()" [disabled]="!isOtpComplete() || isLoading"
          class="w-full bg-gradient-to-r from-gray-900 to-black text-white py-4 px-6 rounded-2xl font-bold text-lg shadow-xl hover:shadow-2xl transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center space-x-3">
          <div *ngIf="isLoading" class="w-6 h-6 border-2 border-white/30 border-t-white rounded-full animate-spin">
          </div>
          
          <span>{{ isLoading ? 'Verificando...' : 'Verificar código' }}</span>
        </button>

        <!-- Help Text -->
        <div class="mt-8 p-4 bg-gray-50 rounded-xl">
          <p class="text-gray-600 text-sm leading-relaxed">
            <strong>Consejo:</strong> Revisa tu carpeta de spam si no encuentras el correo.
            El código expira en 10 minutos.
          </p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
