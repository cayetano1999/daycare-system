<app-kuido-header title="Register"></app-kuido-header>

<ion-content>
  <div class="login-container">
    <ion-row>
      <ion-col size="12" class="disclaimer px-4 mb-4">
        <span>Please complete the following information for your registration</span>
      </ion-col>
    </ion-row>
    <!-- Form -->
    <ion-row>
      <ion-col size="12">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

          <div class="form-group">
            <label>Name</label>
            <input type="text" formControlName="name" placeholder="John Doe">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" formControlName="email" placeholder="user@mail.com">
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" formControlName="phone" placeholder="+18093716874">
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="password-input">
              <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
              <button type="button" (click)="togglePassword()" class="toggle-password">
                <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-input">
              <input [type]="showPasswordConfirm() ? 'text' : 'password'" formControlName="passwordConfirm"
                placeholder="••••••••">
              <button type="button" (click)="togglePasswordConfirm()" class="toggle-password">
                <ion-icon [name]="showPasswordConfirm() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>


          <button type="submit" class="login-button" [disabled]="!loginForm.valid">
            Continue
          </button>

          <div class="form-group mb-5">
            <app-kuido-social-login (googleLogin)="loginViaGoogle()"></app-kuido-social-login>
          </div>

        </form>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
