<ion-content class="page-bg">

   <app-custom-header
    [title]="'Editar Tutor'"
    [subtitle]="'Actualiza la información del tutor legal'"
    [showRightBtn]="true"
    [textRightBtn]="'Cancelar'"
    [iconRightBtn]="'close-circle'"
    (rightBtnClick)="goBack()"
  ></app-custom-header>
  <div class="container">

    <!-- Page header -->
    <!-- <div class="page-header">
      <h1>Editar Tutor</h1>
      <p>Actualiza la información del tutor legal</p>
    </div> -->

    <!-- Loading -->
    <div *ngIf="loading" class="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando información...</p>
    </div>

    <!-- Form -->
    <form *ngIf="!loading" (ngSubmit)="saveGuardian()">

      <!-- PERSONAL INFO -->
      <div class="card">
        <div class="card-header">
          <ion-icon name="person-outline"></ion-icon>
          <span>Información Personal</span>
        </div>

        <div class="card-body">

          <div class="form-group">
            <label>Nombre completo *</label>
            <input
              type="text"
              [(ngModel)]="form.full_name"
              name="full_name"
              [class.invalid]="hasError('full_name')"
            />
            <small *ngIf="hasError('full_name')" class="error">
              {{ getErrorMessage('full_name') }}
            </small>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Tipo de identificación *</label>
              <select
                [(ngModel)]="form.identification_type"
                name="identification_type">
                <option *ngFor="let type of identificationTypes" [value]="type">
                  {{ type }}
                </option>
              </select>
            </div>

            <div class="form-group">
              <label>Número de identificación *</label>
              <input
                type="text"
                [(ngModel)]="form.identification_number"
                name="identification_number"
                [class.invalid]="hasError('identification_number')"
              />
              <small *ngIf="hasError('identification_number')" class="error">
                {{ getErrorMessage('identification_number') }}
              </small>
            </div>
          </div>

        </div>
      </div>

      <!-- CONTACT INFO -->
      <div class="card">
        <div class="card-header">
          <ion-icon name="call-outline"></ion-icon>
          <span>Información de Contacto</span>
        </div>

        <div class="card-body">

          <div class="grid-2">
            <div class="form-group">
              <label>Teléfono</label>
              <input
                type="tel"
                [(ngModel)]="form.phone_number"
                (input)="formatPhoneNumber($event)"
                name="phone_number"
                placeholder="809-123-4567"
              />
              <small class="hint">Formato: 809-123-4567</small>
            </div>

            <div class="form-group">
              <label>Lugar de trabajo</label>
              <input
                type="text"
                [(ngModel)]="form.workplace"
                name="workplace"
                placeholder="Opcional"
              />
            </div>
          </div>

        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button
          type="button"
          class="btn-secondary"
          (click)="goBack()"
          [disabled]="saving">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="saving">
          <ion-spinner *ngIf="saving" name="crescent"></ion-spinner>
          <span *ngIf="!saving">Guardar cambios</span>
        </button>
      </div>

      <!-- FOOT NOTE -->
      <div class="note">
        <ion-icon name="information-circle-outline"></ion-icon>
        Los campos marcados con * son obligatorios
      </div>

    </form>
  </div>
</ion-content>
