@if(profile){


<ion-row>
  <ion-col size="12" style="margin-left: -3vw;">
    <ion-item lines="none">
      <ion-avatar slot="start">
        <img [src]="profile?.avatar_url || 'assets/img/shared/profile.svg'" alt="Profile" />
      </ion-avatar> 
      <ion-label class="greeting-section">
        <b>Welcome</b>
        <p>{{profile?.full_name}}</p>
      </ion-label>
    </ion-item>
  </ion-col>
</ion-row>
}
