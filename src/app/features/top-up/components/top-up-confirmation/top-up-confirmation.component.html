<div class="custom-modal topup-confirmation" >
    <ion-grid class="top-up-container">
      <ion-row>
        <ion-col size="12" class="ion-text-center">
          <img src="../../../../../assets/img/shared/sendtopup.svg" alt="Icon" class="top-up-icon">
        </ion-col>
      </ion-row>
  
      <ion-row>
        <ion-col size="12" class="ion-text-center">
          <h2 class="top-up-title">Top Up to send</h2>
          <p class="top-up-description">
            Send this top up to continue sharing and connecting with that special someone
          </p>
        </ion-col>
      </ion-row>
  
      <ion-row>
        <ion-col size="12" class="ion-text-center">
          <div class="amount-container">
            <span class="amount-label">Top Up</span>
            <span class="amount-value">$4.99</span>
          </div>
        </ion-col>
      </ion-row>
  
      <ion-row>
        <ion-col size="12">
          <ion-button (click)="onConfirm()" expand="block" class="confirm-button">
            Confirm
          </ion-button>
        </ion-col>
      </ion-row>
  
      <ion-row>
        <ion-col size="12">
          <ion-button (click)="onCancel()" expand="block" fill="clear" class="cancel-button">
            Cancel
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
</div>
