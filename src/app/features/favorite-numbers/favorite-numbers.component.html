<app-kuido-header title="Favorite Numbers"></app-kuido-header>

<ion-content>
  <div class="search-container">
    <div class="search-wrapper">
      <ion-input 
        class="search-input" 
        placeholder="Name or phone number">
      </ion-input>
      <img class="search-icon" src="../../../assets/img/shared/find.svg" alt="Search icon" />
    </div>
  </div>

  <ion-list class="contacts-container">
    <ion-item *ngFor="let contact of contacts" lines="none" class="contact-card">
      <div class="contact-content">
        <div class="contact-info">
          <ion-avatar>
            <img [src]="contact.image" [alt]="contact.name + ' profile'" />
          </ion-avatar>
          <div class="contact-details">
            <div class="contact-name">{{ contact.name }}</div>
            <div class="contact-phone">{{ contact.phone }}</div>
          </div>
        </div>
        <img 
          class="favorite-star" 
          src="assets/img/shared/estrella-de-la-lista-de-deseos.svg" 
          alt="Favorite star" 
        />
      </div>
    </ion-item>
  </ion-list>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="send-button-container">
      <ion-button expand="block" class="send-button">
        Send
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
