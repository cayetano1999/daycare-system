<ion-row>
  <ion-col size="12" class="mt-3">
    <!-- Box Component Template -->
    <div class="box-container ">

      <!-- Sheet content -->
      <div class="sheet-content">
        <!-- Visually hidden title for accessibility -->
        <h2 class="sheet-title">User Information</h2>

        <!-- Email information -->
        <div class="email-section">
          <p class="email-text">
            <span class="email-label">Contact:</span> {{ profile.contact }}
          </p>
        </div>

        <!-- Name input field -->
        <div class="name-section">
          <div class="input-container">
            <label for="name" class="name-label">Name</label>
            <input id="name" type="text" class="name-input" [value]="profile.full_name" (input)="onNameChange($event)" />
          </div>
        </div>

        <!-- Save button -->
        <div class="button-section">
          <button class="save-button" (click)="onSave()">
            Save
          </button>

          <button class="cancel-button mt-3" (click)="onCancel()">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </ion-col>
</ion-row>
