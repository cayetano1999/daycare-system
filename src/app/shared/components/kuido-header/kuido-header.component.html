<ion-header class="ion-no-border">
  <ion-toolbar class="ion-no-border pb-2  px-3 pt-2" [ngClass]="{'pt-4': isIos}">
    <!-- Header with background image -->
    <ion-icon style="font-size: 30px;" (click)="back()" slot="start" name="chevron-back"></ion-icon>
    <ion-title class="title"><b>{{title}}</b></ion-title>
    @if(bells) {
    <ion-icon slot="end" name="notifications-outline"></ion-icon>
  }

  </ion-toolbar>
</ion-header>
