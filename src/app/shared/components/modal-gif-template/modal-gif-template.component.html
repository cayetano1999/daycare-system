<ion-header>
  <ion-toolbar class="ion-no-border" style="--background: #fff;">
    <ion-icon class="py-4" style="font-size: 1.8rem;" color="dark" (click)="close()" slot="start" name="chevron-back"></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="flex items-center justify-center h-full">
    <img [src]="imgUrl" alt="" style="height: 100%;">
  </div>
</ion-content>
